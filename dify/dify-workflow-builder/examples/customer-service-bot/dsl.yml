app:
  description: Multi-turn support bot that rewrites follow-ups into search queries before retrieving.
  icon: 🎧
  icon_type: emoji
  icon_background: '#DCFCE7'
  mode: advanced-chat
  name: Customer Service Bot
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      number_limits: 3
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: Hi! How can I help today?
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: edge-start-llm_rewrite
      source: start
      sourceHandle: source
      target: llm_rewrite
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: knowledge-retrieval
      id: edge-llm_rewrite-retriever
      source: llm_rewrite
      sourceHandle: source
      target: retriever
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: edge-retriever-llm_answer
      source: retriever
      sourceHandle: source
      target: llm_answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: edge-llm_answer-answer
      source: llm_answer
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        type: start
        title: 开始
        desc: ''
        selected: false
        variables: []
      height: 90
      id: start
      position:
        x: 80
        y: 340
      positionAbsolute:
        x: 80
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: llm
        title: LLM 问题改写
        desc: ''
        selected: false
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.0
            max_tokens: 128
            top_p: 1
        prompt_template:
        - role: system
          text: 'Rewrite the user''s latest message as a standalone search query.

            - Resolve pronouns using the conversation history.

            - Output the query only, no quotes, no explanation.

            - If it is already standalone, repeat it unchanged.'
        - role: user
          text: '{{#sys.query#}}'
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
          configs:
            variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: true
            size: 10
        structured_output:
          enabled: false
        reasoning_format: tagged
        retry_config:
          enabled: false
          exponential_backoff:
            enabled: false
            max_interval: 10000
            multiplier: 2
          max_retries: 1
          retry_interval: 1000
      height: 200
      id: llm_rewrite
      position:
        x: 400
        y: 340
      positionAbsolute:
        x: 400
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: knowledge-retrieval
        title: 知识检索
        desc: ''
        selected: false
        query_variable_selector:
        - llm_rewrite
        - text
        dataset_ids: []
        retrieval_mode: multiple
        multiple_retrieval_config:
          top_k: 4
          score_threshold: null
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model:
            provider: ''
            model: ''
          weights: null
        metadata_filtering_mode: disabled
        vision:
          enabled: false
          configs:
            variable_selector: []
      height: 140
      id: retriever
      position:
        x: 720
        y: 340
      positionAbsolute:
        x: 720
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: llm
        title: LLM 客服回答
        desc: ''
        selected: false
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.3
            max_tokens: 1200
            top_p: 1
        prompt_template:
        - role: system
          text: 'You are a customer service agent.

            Rules:

            - Answer from the reference material; cite it as [Source N].

            - If the material does not cover it, say you will escalate and ask for the detail the team needs.

            - Never promise a refund, discount, or timeline you cannot verify.'
        - role: user
          text: 'Reference:

            {{#context#}}


            Customer question:

            {{#sys.query#}}'
        context:
          enabled: true
          variable_selector:
          - retriever
          - result
        vision:
          enabled: false
          configs:
            variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: true
            size: 10
        structured_output:
          enabled: false
        reasoning_format: tagged
        retry_config:
          enabled: false
          exponential_backoff:
            enabled: false
            max_interval: 10000
            multiplier: 2
          max_retries: 1
          retry_interval: 1000
      height: 200
      id: llm_answer
      position:
        x: 1040
        y: 340
      positionAbsolute:
        x: 1040
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: answer
        title: 直接回复
        desc: ''
        selected: false
        answer: '{{#llm_answer.text#}}'
        variables: []
      height: 105
      id: answer
      position:
        x: 1360
        y: 340
      positionAbsolute:
        x: 1360
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
