app:
  description: Extract incident severity, then fan out to SMS + DingTalk (severe), email (medium), or Feishu (minor).
  icon: 🚨
  icon_type: emoji
  icon_background: '#FEE2E2'
  mode: workflow
  name: Multi-channel Notification
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - name: SMS_WEBHOOK_URL
    value: https://sms.example.com/send
    value_type: string
    description: SMS gateway endpoint
  - name: DINGTALK_WEBHOOK
    value: https://oapi.dingtalk.com/robot/send?access_token=
    value_type: string
    description: DingTalk bot
  - name: FEISHU_WEBHOOK
    value: https://open.feishu.cn/open-apis/bot/v2/hook/
    value_type: string
    description: Feishu bot
  - name: EMAIL_API_URL
    value: https://api.example.com/v3/mail/send
    value_type: string
    description: Transactional email API
  - name: EMAIL_API_KEY
    value: ''
    value_type: secret
    description: Email API token
  - name: ONCALL_EMAIL
    value: oncall@example.com
    value_type: string
    description: On-call mailing list
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      number_limits: 3
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: parameter-extractor
      id: edge-start-extract_alert
      source: start
      sourceHandle: source
      target: extract_alert
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: parameter-extractor
        targetType: if-else
      id: edge-extract_alert-if_severity
      source: extract_alert
      sourceHandle: source
      target: if_severity
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: edge-sev-sms
      source: if_severity
      sourceHandle: severe
      target: http_sms
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: edge-sev-im
      source: if_severity
      sourceHandle: severe
      target: http_im
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: edge-med-mail
      source: if_severity
      sourceHandle: medium
      target: http_email
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: edge-minor-im
      source: if_severity
      sourceHandle: 'false'
      target: http_im_minor
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: variable-aggregator
      id: edge-sms-agg
      source: http_sms
      sourceHandle: source
      target: agg_result
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: variable-aggregator
      id: edge-im-agg
      source: http_im
      sourceHandle: source
      target: agg_result
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: variable-aggregator
      id: edge-mail-agg
      source: http_email
      sourceHandle: source
      target: agg_result
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: variable-aggregator
      id: edge-minor-agg
      source: http_im_minor
      sourceHandle: source
      target: agg_result
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: variable-aggregator
        targetType: end
      id: edge-agg_result-end
      source: agg_result
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        type: start
        title: 开始
        desc: ''
        selected: false
        variables:
        - variable: alert
          label: Alert payload (free text or JSON)
          type: paragraph
          required: true
          max_length: null
          options: []
      height: 90
      id: start
      position:
        x: 80
        y: 340
      positionAbsolute:
        x: 80
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: parameter-extractor
        title: 提取告警要素
        desc: ''
        selected: false
        model:
          provider: langgenius/openai/openai
          name: gpt-4o-mini
          mode: chat
          completion_params:
            temperature: 0.0
            max_tokens: 512
            top_p: 1
        query:
        - start
        - alert
        parameters:
        - name: severity
          type: select
          description: 'One of: severe, medium, minor'
          required: true
          options:
          - severe
          - medium
          - minor
        - name: summary
          type: string
          description: One-sentence summary, under 40 words
          required: true
          options: null
        - name: service
          type: string
          description: Affected service name
          required: false
          options: null
        instruction: 'Extract the incident fields from the alert. Read severity carefully: severe = outage or data loss, medium = degraded service, minor = informational.'
        reasoning_mode: prompt
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: false
            size: 10
        vision:
          enabled: false
          configs:
            variable_selector: []
      height: 140
      id: extract_alert
      position:
        x: 400
        y: 340
      positionAbsolute:
        x: 400
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: if-else
        title: 告警等级
        desc: ''
        selected: false
        logical_operator: and
        cases:
        - case_id: severe
          id: severe
          logical_operator: and
          conditions:
          - id: cond-extract_alert-severity
            varType: string
            variable_selector:
            - extract_alert
            - severity
            comparison_operator: is
            value: severe
        - case_id: medium
          id: medium
          logical_operator: and
          conditions:
          - id: cond-extract_alert-severity
            varType: string
            variable_selector:
            - extract_alert
            - severity
            comparison_operator: is
            value: medium
      height: 140
      id: if_severity
      position:
        x: 720
        y: 340
      positionAbsolute:
        x: 720
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: http-request
        title: 短信通知
        desc: ''
        selected: false
        method: post
        url: '{{env.SMS_WEBHOOK_URL}}'
        authorization:
          type: no-auth
          config: null
        headers: ''
        params: ''
        body:
          type: json
          data:
          - key: text
            value: '[SEVERE] {{#extract_alert.summary#}} ({{#extract_alert.service#}})'
            type: text
      height: 140
      id: http_sms
      position:
        x: 1060
        y: 120
      positionAbsolute:
        x: 1060
        y: 120
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: http-request
        title: 钉钉通知
        desc: ''
        selected: false
        method: post
        url: '{{env.DINGTALK_WEBHOOK}}'
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type: application/json'
        params: ''
        body:
          type: json
          data:
          - key: msgtype
            value: text
            type: text
          - key: text
            value: '{"content": "[SEVERE] {{#extract_alert.summary#}}"}'
            type: text
      height: 140
      id: http_im
      position:
        x: 1060
        y: 280
      positionAbsolute:
        x: 1060
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: http-request
        title: 邮件通知
        desc: ''
        selected: false
        method: post
        url: '{{env.EMAIL_API_URL}}'
        authorization:
          type: no-auth
          config: null
        headers: 'Authorization: Bearer {{env.EMAIL_API_KEY}}

          Content-Type: application/json'
        params: ''
        body:
          type: json
          data:
          - key: to
            value: '{{env.ONCALL_EMAIL}}'
            type: text
          - key: subject
            value: '[MEDIUM] {{#extract_alert.service#}}'
            type: text
          - key: body
            value: '{{#extract_alert.summary#}}'
            type: text
      height: 140
      id: http_email
      position:
        x: 1060
        y: 440
      positionAbsolute:
        x: 1060
        y: 440
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: http-request
        title: 飞书通知
        desc: ''
        selected: false
        method: post
        url: '{{env.FEISHU_WEBHOOK}}'
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type: application/json'
        params: ''
        body:
          type: json
          data:
          - key: msg_type
            value: text
            type: text
          - key: content
            value: '{"text": "[MINOR] {{#extract_alert.summary#}}"}'
            type: text
      height: 140
      id: http_im_minor
      position:
        x: 1060
        y: 600
      positionAbsolute:
        x: 1060
        y: 600
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: variable-aggregator
        title: 合并通知结果
        desc: ''
        selected: false
        output_type: string
        variables:
        - - http_sms
          - body
        - - http_im
          - body
        - - http_email
          - body
        - - http_im_minor
          - body
        advanced_settings:
          group_enabled: false
          groups: []
      height: 110
      id: agg_result
      position:
        x: 1420
        y: 340
      positionAbsolute:
        x: 1420
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        type: end
        title: 结束
        desc: ''
        selected: false
        outputs:
        - variable: notify_result
          value_type: string
          value_selector:
          - agg_result
          - output
        - variable: severity
          value_type: string
          value_selector:
          - extract_alert
          - severity
        - variable: summary
          value_type: string
          value_selector:
          - extract_alert
          - summary
      height: 140
      id: end
      position:
        x: 1740
        y: 340
      positionAbsolute:
        x: 1740
        y: 340
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
