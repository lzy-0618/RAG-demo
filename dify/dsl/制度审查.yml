# =====================================================================
# 应用三：制度审查 Workflow（需求③）
# 设计依据：docs/Dify应用与工作流设计.md 第 4 节（冲突检测版）
# 格式依据：Dify 1.17.0 真实导出格式（节点顶层 type: custom，语义类型在 data.type）
#
# 编排：Start(chunk_text)
#   → 知识检索（法律法规 + 规章制度，2 库）
#   → LLM-1 合规判定（是否与上位法/现行制度冲突）→ Code 解析
#   → IF 合规 → 直接汇入 End（risks=[]）
#     IF 不合规 → LLM-2 冲突标注 → Code 兜底解析 → 汇入 End
#
# 与合同审查的差异：仅挂 2 库（无案例/审核规则/专家标注）；LLM-2 输出
# 无 reference_case 字段，修改建议依据被冲突的上位条款给出。
#
# 导入后必做：
#   1. 「知识检索」节点 dataset_ids 为空，需在 UI 选择 2 个知识库：
#      法律法规库 / 某钢规章制度库
#   2. LLM 节点模型为 langgenius/deepseek/deepseek → deepseek-chat
# =====================================================================
app:
  description: 对新规章制度文本块做合规审查：检测其是否与上位法律法规或现行有效的规章制度冲突；存在冲突时逐条标注具体与哪些法条/制度条款冲突，并给出修改建议。输入为后端切好的单块制度文本 chunk_text。
  icon: 📋
  icon_background: '#EAF3FF'
  mode: workflow
  name: 制度审查
  use_icon_as_answer_icon: false

dependencies: []
kind: app
version: 0.3.1

workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
          - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: knowledge-retrieval
        id: edge-start-retriever
        source: start
        sourceHandle: source
        target: retriever
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: knowledge-retrieval
          targetType: llm
        id: edge-retriever-judge
        source: retriever
        sourceHandle: source
        target: llm_judge
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: edge-judge-parse
        source: llm_judge
        sourceHandle: source
        target: code_judge
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: if-else
        id: edge-judge-branch
        source: code_judge
        sourceHandle: source
        target: if_compliant
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: variable-aggregator
        id: edge-true-reason
        source: if_compliant
        sourceHandle: 'true'
        target: agg_reason
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: variable-aggregator
        id: edge-true-risks
        source: if_compliant
        sourceHandle: 'true'
        target: agg_risks
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: llm
        id: edge-false-analyze
        source: if_compliant
        sourceHandle: 'false'
        target: llm_analyze
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: code
        id: edge-analyze-parse
        source: llm_analyze
        sourceHandle: source
        target: code_parse
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: variable-aggregator
        id: edge-false-reason
        source: code_parse
        sourceHandle: source
        target: agg_reason
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: variable-aggregator
        id: edge-false-risks
        source: code_parse
        sourceHandle: source
        target: agg_risks
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: variable-aggregator
          targetType: end
        id: edge-reason-end
        source: agg_reason
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: variable-aggregator
          targetType: end
        id: edge-risks-end
        source: agg_risks
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: if-else
          targetType: variable-aggregator
        id: edge-true-parse
        source: if_compliant
        sourceHandle: 'true'
        target: agg_parse_error
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: variable-aggregator
        id: edge-false-parse
        source: code_parse
        sourceHandle: source
        target: agg_parse_error
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: variable-aggregator
          targetType: end
        id: edge-parse-end
        source: agg_parse_error
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ''
          selected: false
          title: 开始
          type: start
          variables:
            - label: 待审查文本块
              max_length: null
              options: []
              required: true
              type: paragraph
              variable: chunk_text
        height: 90
        id: start
        position: {x: 80, y: 300}
        positionAbsolute: {x: 80, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          dataset_ids: []
          desc: ''
          metadata_filtering_mode: disabled
          multiple_retrieval_config:
            reranking_enable: true
            reranking_mode: reranking_model
            reranking_model:
              model: BAAI/bge-reranker-v2-m3
              provider: langgenius/siliconflow/siliconflow
            score_threshold: null
            top_k: 5
            weights: null
          query_variable_selector:
            - start
            - chunk_text
          retrieval_mode: multiple
          selected: false
          title: 知识检索（法规/现行制度）
          type: knowledge-retrieval
          vision:
            configs:
              variable_selector: []
            enabled: false
        height: 140
        id: retriever
        position: {x: 380, y: 300}
        positionAbsolute: {x: 380, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: true
            variable_selector:
              - retriever
              - result
          desc: ''
          memory:
            enabled: false
            window:
              enabled: false
              size: 50
          model:
            completion_params:
              max_tokens: 1024
              response_format: json_object
              temperature: 0.1
              thinking: false
            mode: chat
            name: deepseek-v4-flash
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - role: system
              text: |
                你是规章制度合规审查员。请依据参考资料判断「待审查文本」（一份新规章制度的文本块）是否合规——
                即是否与上位法律法规或现行有效的规章制度存在冲突。
                判定标准：
                1. 与参考资料中的法律法规/现行制度存在明确冲突、超越权限设定事项、或同一事项规定矛盾时，判定为不合规。
                2. 仅凭参考资料中找不到依据的疑虑，不算不合规（判定为合规）。
                3. 纯文字表述、格式问题不算不合规（那是编辑问题，不是合规问题）。
                只输出 JSON，不要输出任何其他文字，格式：
                {"is_compliant": true 或 false, "reason": "判定依据，一两句话；不合规时指出与哪些法规/制度存在冲突"}
            - role: user
              text: |
                参考资料（法律法规/现行规章制度检索结果）：
                {{#context#}}

                待审查文本：
                {{#start.chunk_text#}}

                请判断该文本块是否与上位依据存在冲突，只输出 JSON。
          retry_config:
            enabled: false
            exponential_backoff:
              enabled: false
              max_interval: 10000
              multiplier: 2
            max_retries: 1
            retry_interval: 1000
          selected: false
          structured_output:
            enabled: false
          title: LLM-1 合规判定
          type: llm
          vision:
            configs:
              variable_selector: []
            enabled: false
        height: 220
        id: llm_judge
        position: {x: 680, y: 300}
        positionAbsolute: {x: 680, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import json
            import re

            THINK_RE = re.compile(r"<think>.*?</think>", re.DOTALL | re.IGNORECASE)


            def _extract_json(text: str, required_key: str):
                """提取含目标键的 JSON 对象。

                模型（尤其开启思考模式时）会在答案前后输出 <think> 思维链或 JSON 示例，
                因此需先剥离思考块，再从后往前逐个候选对象尝试解析，取最后一个含目标键的
                合法对象（即最终答案）。
                """
                text = THINK_RE.sub("", text or "")
                fenced = re.search(r"```(?:json)?\s*(.*?)```", text, re.DOTALL)
                if fenced:
                    text = fenced.group(1)
                try:
                    data = json.loads(text.strip())
                    if isinstance(data, dict) and required_key in data:
                        return data
                except Exception:
                    pass
                starts = [i for i, ch in enumerate(text) if ch == "{"]
                for start in reversed(starts):
                    depth, in_str, escape = 0, False, False
                    for i in range(start, len(text)):
                        ch = text[i]
                        if in_str:
                            if escape:
                                escape = False
                            elif ch == "\\":
                                escape = True
                            elif ch == '"':
                                in_str = False
                            continue
                        if ch == '"':
                            in_str = True
                        elif ch == "{":
                            depth += 1
                        elif ch == "}":
                            depth -= 1
                            if depth == 0:
                                try:
                                    data = json.loads(text[start:i + 1])
                                except Exception:
                                    break
                                if isinstance(data, dict) and required_key in data:
                                    return data
                                break
                return None


            def main(llm_output: str) -> dict:
                data = _extract_json(llm_output, "is_compliant")
                if data is None:
                    # 解析失败时默认不合规，宁可多跑一轮冲突标注，不可漏审
                    return {
                        "is_compliant": "false",
                        "reason": "判定结果解析失败，转入冲突标注",
                        "risks": [],
                    }
                is_compliant = bool(data.get("is_compliant", False))
                default_reason = "判定为合规" if is_compliant else "判定存在冲突，转入冲突标注"
                return {
                    "is_compliant": "true" if is_compliant else "false",
                    "reason": str(data.get("reason") or default_reason),
                    # 合规分支固定空冲突列表，供「合并冲突列表」聚合器取值
                    "risks": [],
                    # 判定本身解析成功，错误标志恒为 false（聚合器需与 code_parse 输出同构）
                    "parse_error": "false",
                }
          code_language: python3
          desc: ''
          outputs:
            parse_error:
              children: null
              type: string
            is_compliant:
              children: null
              type: string
            reason:
              children: null
              type: string
            risks:
              children: null
              type: array[object]
          selected: false
          title: 解析判定结果
          type: code
          variables:
            - value_selector:
                - llm_judge
                - text
              variable: llm_output
        height: 160
        id: code_judge
        position: {x: 980, y: 300}
        positionAbsolute: {x: 980, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          cases:
            - case_id: 'true'
              conditions:
                - comparison_operator: is
                  id: cond-compliant-true
                  value: 'true'
                  varType: string
                  variable_selector:
                    - code_judge
                    - is_compliant
              id: 'true'
              logical_operator: and
          desc: ''
          logical_operator: and
          selected: false
          title: 是否合规
          type: if-else
        height: 140
        id: if_compliant
        position: {x: 1280, y: 300}
        positionAbsolute: {x: 1280, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context:
            enabled: true
            variable_selector:
              - retriever
              - result
          desc: ''
          memory:
            enabled: false
            window:
              enabled: false
              size: 50
          model:
            completion_params:
              max_tokens: 8192
              response_format: json_object
              temperature: 0.2
              thinking: false
            mode: chat
            name: deepseek-v4-flash
            provider: langgenius/deepseek/deepseek
          prompt_template:
            - role: system
              text: |
                你是规章制度合规审查专家。请审查待审查文本（一份新规章制度的文本块），逐条识别其与法律法规或现行有效规章制度相冲突的内容，并标注具体与哪些条款冲突。
                输出要求：
                1. 逐条识别冲突条款，输出条款原文 clause 与风险等级 risk_level（high/medium/low）。
                2. violations 数组列出全部冲突对象：law_name 必须为参考资料中真实的《法律法规名》或《现行制度名》，article 为具体条款号，description 说明新制度条款如何与该条款冲突/矛盾，不得编造。
                3. 同一条款可与多个上位依据冲突，violations 全部列出。
                4. 每条冲突给出 suggestion（依据被引用的上位条款给出的修改建议）。
                5. 本块无冲突时 risks 返回 []。
                注意：每条 description 控制在 60 字以内，violations 最多列 3 条；
                全文最多输出 10 条最主要的风险，务必输出完整且合法的 JSON（输出过长会被截断导致解析失败）。
                只输出 JSON，不要输出任何其他文字，结构：
                {"risks": [{"clause": "...", "risk_level": "high|medium|low", "violations": [{"law_name": "《...》", "article": "...", "description": "..."}], "suggestion": "..."}]}
            - role: user
              text: |
                参考资料（法律法规/现行规章制度检索结果）：
                {{#context#}}

                待审查文本：
                {{#start.chunk_text#}}

                请逐条标注冲突并按给定结构只输出 JSON。
          retry_config:
            enabled: false
            exponential_backoff:
              enabled: false
              max_interval: 10000
              multiplier: 2
            max_retries: 1
            retry_interval: 1000
          selected: false
          structured_output:
            enabled: false
          title: LLM-2 冲突标注
          type: llm
          vision:
            configs:
              variable_selector: []
            enabled: false
        height: 260
        id: llm_analyze
        position: {x: 1580, y: 480}
        positionAbsolute: {x: 1580, y: 480}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |
            import json
            import re

            THINK_RE = re.compile(r"<think>.*?</think>", re.DOTALL | re.IGNORECASE)


            def _extract_json(text: str, required_key: str):
                """提取含目标键的 JSON 对象（先剥思考块，再从后往前取最后一个合法对象）。"""
                text = THINK_RE.sub("", text or "")
                fenced = re.search(r"```(?:json)?\s*(.*?)```", text, re.DOTALL)
                if fenced:
                    text = fenced.group(1)
                try:
                    data = json.loads(text.strip())
                    if isinstance(data, dict) and required_key in data:
                        return data
                except Exception:
                    pass
                starts = [i for i, ch in enumerate(text) if ch == "{"]
                for start in reversed(starts):
                    depth, in_str, escape = 0, False, False
                    for i in range(start, len(text)):
                        ch = text[i]
                        if in_str:
                            if escape:
                                escape = False
                            elif ch == "\\":
                                escape = True
                            elif ch == '"':
                                in_str = False
                            continue
                        if ch == '"':
                            in_str = True
                        elif ch == "{":
                            depth += 1
                        elif ch == "}":
                            depth -= 1
                            if depth == 0:
                                try:
                                    data = json.loads(text[start:i + 1])
                                except Exception:
                                    break
                                if isinstance(data, dict) and required_key in data:
                                    return data
                                break
                return None


            def main(llm_output: str) -> dict:
                data = _extract_json(llm_output, "risks")
                risks = data.get("risks") if isinstance(data, dict) else None
                if not isinstance(risks, list):
                    # 兜底：解析失败返回空列表并标记，由人工复核该文本块
                    return {
                        "risks": [],
                        "summary": "冲突结果解析失败，请人工复核该文本块",
                        "parse_error": "true",
                    }
                return {
                    "risks": risks,
                    "summary": "本块共识别出 {} 处冲突".format(len(risks)),
                    "parse_error": "false",
                }
          code_language: python3
          desc: ''
          outputs:
            parse_error:
              children: null
              type: string
            risks:
              children: null
              type: array[object]
            summary:
              children: null
              type: string
          selected: false
          title: 兜底解析冲突JSON
          type: code
          variables:
            - value_selector:
                - llm_analyze
                - text
              variable: llm_output
        height: 180
        id: code_parse
        position: {x: 1880, y: 480}
        positionAbsolute: {x: 1880, y: 480}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          advanced_settings:
            group_enabled: false
            groups: []
          desc: ''
          output_type: string
          selected: false
          title: 合并合规结论
          type: variable-aggregator
          variables:
            - - code_judge
              - reason
            - - code_parse
              - summary
        height: 110
        id: agg_reason
        position: {x: 2180, y: 220}
        positionAbsolute: {x: 2180, y: 220}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          advanced_settings:
            group_enabled: false
            groups: []
          desc: ''
          output_type: array[object]
          selected: false
          title: 合并冲突列表
          type: variable-aggregator
          variables:
            # 顺序即优先级：聚合器取「第一个非空值」。
            # code_judge 在分支前执行、必然有值（[]），因此分支专属的 code_parse 必须排在它前面，
            # 否则不合规分支识别出的冲突会被 code_judge 的空数组覆盖。
            - - code_parse
              - risks
            - - code_judge
              - risks
        height: 110
        id: agg_risks
        position: {x: 2180, y: 400}
        positionAbsolute: {x: 2180, y: 400}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      # 聚合 parse_error：区分「确无风险」与「解析失败」（后者需人工复核，不能当成合规）
      - data:
          advanced_settings:
            group_enabled: false
            groups: []
          desc: ''
          output_type: string
          selected: false
          title: 合并解析标志
          type: variable-aggregator
          variables:
            # 同上：分支专属来源排在前，否则会被恒为 false 的 code_judge 覆盖
            - - code_parse
              - parse_error
            - - code_judge
              - parse_error
        height: 110
        id: agg_parse_error
        position: {x: 2180, y: 560}
        positionAbsolute: {x: 2180, y: 560}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector:
                - code_judge
                - is_compliant
              value_type: string
              variable: is_compliant
            - value_selector:
                - agg_reason
                - output
              value_type: string
              variable: compliance_reason
            - value_selector:
                - agg_risks
                - output
              value_type: array[object]
              variable: risks
            - value_selector:
                - agg_parse_error
                - output
              value_type: string
              variable: parse_error
          selected: false
          title: 结束
          type: end
        height: 120
        id: end
        position: {x: 2480, y: 300}
        positionAbsolute: {x: 2480, y: 300}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
