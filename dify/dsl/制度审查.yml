    - id: split_regulation
      type: custom
      data:
        type: code
        title: 按段落切块
        desc: ''
        selected: false
        code: |
          import re

          MAX_CHARS = 2000

          def main(text: str) -> dict:
              paragraphs = [p.strip() for p in re.split(r"\r?\n", text or "") if p.strip()]
              chunks, buffer, size = [], [], 0
              for paragraph in paragraphs:
                  while len(paragraph) > MAX_CHARS:
                      if buffer:
                          chunks.append("\n".join(buffer))
                          buffer, size = [], 0
                      cut = max(paragraph.rfind(mark, 0, MAX_CHARS) for mark in ("。", "；", ";", "\n"))
                      cut = cut + 1 if cut >= MAX_CHARS // 2 else MAX_CHARS
                      chunks.append(paragraph[:cut])
                      paragraph = paragraph[cut:].strip()
                  if not paragraph:
                      continue
                  if buffer and size + len(paragraph) > MAX_CHARS:
                      chunks.append("\n".join(buffer))
                      buffer, size = [], 0
                  buffer.append(paragraph)
                  size += len(paragraph)
              if buffer:
                  chunks.append("\n".join(buffer))
              return {"chunks": chunks}
        code_language: python3
        variables:
        - variable: text
          value_selector:
          - extract_doc
          - text
        outputs:
          chunks:
            children: null
            type: array[string]
