    - id: split_contract
      type: custom
      data:
        type: code
        title: 按段落切块
        desc: ''
        selected: false
        code: "import re\n\nMAX_CHARS = 2000\n\ndef main(text: str) -> dict:\n    paragraphs = [p.strip() for p\
          \ in re.split(r\"\\r?\\n\", text or \"\") if p.strip()]\n    chunks, buffer, size = [], [], 0\n    for\
          \ paragraph in paragraphs:\n        while len(paragraph) > MAX_CHARS:\n            if buffer:\n      \
          \          chunks.append(\"\\n\".join(buffer))\n                buffer, size = [], 0\n            cut\
          \ = max(paragraph.rfind(mark, 0, MAX_CHARS) for mark in (\"。\", \"；\", \";\", \"\\n\"))\n            cut\
          \ = cut + 1 if cut >= MAX_CHARS // 2 else MAX_CHARS\n            chunks.append(paragraph[:cut])\n    \
          \        paragraph = paragraph[cut:].strip()\n        if not paragraph:\n            continue\n      \
          \  if buffer and size + len(paragraph) > MAX_CHARS:\n            chunks.append(\"\\n\".join(buffer))\n\
          \            buffer, size = [], 0\n        buffer.append(paragraph)\n        size += len(paragraph)\n\
          \    if buffer:\n        chunks.append(\"\\n\".join(buffer))\n    return {\"chunks\": chunks}\n"
        code_language: python3
        variables:
        - variable: text
          value_selector:
          - extract_doc
          - text
        outputs:
          chunks:
            children: null
            type: array[string]
      height: 140
      width: 244
